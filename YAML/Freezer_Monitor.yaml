substitutions:
  name: "freezer-monitor"
  friendly_name: "Freezer Monitor"
  
esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: "techdregs.freezer-monitor"
    version: "0.2.0"
  on_boot:
    - priority: 500
      then:
        - switch.turn_on: tmp_power
    - priority: -100
      then:
        # Let retained RTC flags and boot retries settle before changing the alarm.
        - delay: 3s
        - wait_until:
            condition:
              lambda: 'return id(alarm_flag).has_state() && id(event_flag).has_state();'
            timeout: 5s
        - lambda: |-
            id(woke_from_event) = id(event_flag).has_state() && id(event_flag).state;
            id(scheduling_ready) = true;
        - script.execute: publish_wake_status

esp32:
  variant: esp32c3
  cpu_frequency: 80MHZ
  framework:
    type: esp-idf

preferences:
  flash_write_interval: 1s

logger:
  id: logger_component
  level: DEBUG #VERBOSE
  #hardware_uart: USB_SERIAL_JTAG
  #logs:
  #  sensor: VERBOSE
  
api:
  id: api_server
  encryption: {}
  # Shutdown recovery owns reboot decisions; do not loop on a network outage.
  reboot_timeout: 0s

provisioning:
  id: provisioning_component
  timeout: 10min

ota:
  - platform: esphome
    id: ota_esphome

dashboard_import:
  package_import_url: github://techdregs/Freezer_Monitor/YAML/Freezer_Monitor.yaml@main
  import_full_config: true

wifi:
  id: wifi_component
  reboot_timeout: 0s
  fast_connect: True
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:
  id: captive_portal_component

improv_ble:
  id: improv_ble_component
  authorizer: none

safe_mode:
  id: safe_mode_component
  boot_is_good_after:
    # The reporting window can finish seven seconds into a fast boot.
    seconds: 5

globals:
  - id: cycle_fired
    type: bool
    restore_value: no
    initial_value: "false"
  - id: woke_from_event
    type: bool
    restore_value: no
    initial_value: "false"
  - id: keep_on_for_testing
    type: bool
    restore_value: yes
    initial_value: "true"
  - id: next_alarm_hour
    type: uint16_t
    restore_value: no
    initial_value: "0"
  - id: next_alarm_minute
    type: uint16_t
    restore_value: no
    initial_value: "0"
  - id: next_alarm_valid
    type: bool
    restore_value: no
    initial_value: "false"
  - id: scheduling_ready
    type: bool
    initial_value: "false"
  - id: report_window_complete
    type: bool
    initial_value: "false"
  - id: subscriber_seen
    type: bool
    initial_value: "false"
  - id: subscriber_since
    type: uint32_t
    initial_value: "0"
  - id: shutdown_hold
    type: bool
    initial_value: "false"
  # RTC memory survives a software reboot, but not the normal hard power cut.
  - id: power_cut_retry_used
    type: bool
    restore_value: true
    storage: rtc
    initial_value: "false"
  # Retain evidence even if the recovery reboot fixes the problem.
  - id: power_cut_fault_latched
    type: bool
    restore_value: true
    initial_value: "false"

switch:
  - platform: gpio
    pin: GPIO10 #pin controls power to ambient TMP102 sensor only
    id: tmp_power
    internal: true
    restore_mode: ALWAYS_ON

  - platform: template
    id: keep_on_for_testing_switch
    name: "Keep On for Configuration"
    icon: mdi:test-tube
    entity_category: config
    restore_mode: disabled

    lambda: |-
      return id(keep_on_for_testing);

    turn_on_action:
      - globals.set:
          id: keep_on_for_testing
          value: "true"
      - logger.log: "Testing mode enabled: PMOS power cycle disabled"

      # If the optional HA helper exists and differs, keep it synchronized.
      - if:
          condition:
            lambda: |-
              return id(keep_awake_requested).has_state() &&
                     !id(keep_awake_requested).state;
          then:
            - homeassistant.action:
                action: input_boolean.turn_on
                data:
                  entity_id: input_boolean.freezer_monitor_keep_awake

    turn_off_action:
      - globals.set:
          id: keep_on_for_testing
          value: "false"
      - logger.log: "Testing mode disabled: normal PMOS cycling enabled"

      # If the optional HA helper exists and differs, keep it synchronized.
      - if:
          condition:
            lambda: |-
              return id(keep_awake_requested).has_state() &&
                     id(keep_awake_requested).state;
          then:
            - homeassistant.action:
                action: input_boolean.turn_off
                data:
                  entity_id: input_boolean.freezer_monitor_keep_awake

binary_sensor:
  - platform: template
    id: power_cut_fault
    name: "Power Cut Fault"
    device_class: problem
    entity_category: diagnostic
    lambda: 'return id(power_cut_fault_latched);'

  # Optional persistent Keep Awake control. If the helper does not exist in HA,
  # this sensor has no state and the normal device switch remains independent.
  - platform: homeassistant
    id: keep_awake_requested
    entity_id: input_boolean.freezer_monitor_keep_awake
    internal: true
    trigger_on_initial_state: true
    on_state:
      then:
        - lambda: |-
            id(keep_on_for_testing) = x;
  
  - platform: tmp102
    tmp102_id: freezer_temperature
    id: high_temp_alert
    name: "High Temp Alert"

  - platform: rx8111
    rx8111_id: freezer_rtc
    event_flag:
      id: event_flag
      internal: true
    alarm_flag:
      id: alarm_flag
      internal: true
    
i2c:
  id: i2c_bus
  sda: GPIO5
  scl: GPIO6
  scan: true

time:
  - platform: rx8111
    id: freezer_rtc
    update_interval: 5s
    event_poll_interval: 1s
    event_enabled: true
    event_level: low
    evin_pull: pullup_500k
    evin_filter: 2
    on_event:
      then:
        - globals.set:
            id: woke_from_event
            value: "true"
        - delay: 100ms
        - script.execute: publish_wake_status
        - logger.log: "Woke from EVENT — Temp Exceeded"
    alarm_enabled: true
    alarm_hour: 0
    alarm_minute: 0
    alarm_second: 0
    on_alarm:
      then:
        - lambda: |-
            // A simultaneous or earlier EVIN event must still require acknowledgement.
            id(woke_from_event) = id(woke_from_event) ||
                (id(event_flag).has_state() && id(event_flag).state);
        - script.execute: publish_wake_status
        - logger.log: "Woke from ALARM — Daily heartbeat"

  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - logger.log:
            format: "HA time sync → writing to RTC"
            level: INFO
        - rx8111.write_time:
            id: freezer_rtc

sensor:
  - platform: tmp102
    id: ambient_temperature
    name: "Ambient"
    address: 0x49
    i2c_id: i2c_bus
    filters:
      - lambda: return x * (9.0 / 5.0) + 32.0;
    unit_of_measurement: °F
    update_interval: 5s

  - platform: tmp102
    id: freezer_temperature
    name: "Freezer Temperature"
    address: 0x48
    i2c_id: i2c_bus
    conversion_rate: 0.25Hz
    alert_polarity: active_low
    thermostat_mode: comparator
    # Defaults for the restorable threshold number entities below.
    temperature_high: "10°F"
    temperature_low: "9°F"
    filters:
      - lambda: return x * (9.0 / 5.0) + 32.0;
    unit_of_measurement: "°F"
    update_interval: 5s

  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    attenuation: 12dB
    filters:
      - multiply: 1.548      # based on divider ratio adjusted for real measurements
      - median:
          window_size: 3
          send_every: 3
          send_first_at: 3
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: 1s

  - platform: copy
    source_id: battery_voltage
    name: "Battery Percentage"
    id: battery_percentage
    device_class: battery
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
          # voltage : percent
          - 3.50 -> 0
          - 4.08 -> 75
          - 4.13 -> 90
          - 4.20 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  - platform: uptime
    id: device_uptime
    name: "Device Uptime"
    update_interval: 5s

  - platform: wifi_signal
    name: "WiFi Signal dBm"
    id: wifi_db
    update_interval: 5s

text_sensor:
  - platform: rx8111
    rx8111_id: freezer_rtc
    id: event_timestamp
    internal: true
    timestamp_record_mode: overwrite

  - platform: template
    id: last_wake_reason
    name: "Last Wake Reason"
    icon: mdi:power

  - platform: template
    id: last_wake_time
    name: "Last Wake Time"
    icon: mdi:clock-outline

  - platform: tmp102
    tmp102_id: freezer_temperature
    id: threshold_status
    name: "Threshold Status"

number:
  - platform: template
    id: wake_start_hour
    name: "Wake Start Hour (UTC)"
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 12
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      then:
        - script.execute: set_next_alarm

  - platform: template
    id: wake_start_minute
    name: "Wake Start Minute"
    min_value: 0
    max_value: 59
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      then:
        - script.execute: set_next_alarm

  - platform: tmp102
    tmp102_id: freezer_temperature
    temperature_high:
      id: high_temp_threshold
      name: "High Temp Threshold"
      restore_value: true
    temperature_low:
      id: clear_temp_threshold
      name: "Clear Temp Threshold"
      restore_value: true
      
select:
  - platform: template
    id: wake_interval_hours
    name: "Wake Interval Hours"
    options:
      - "0"
      - "1"
      - "2"
      - "4"
      - "6"
      - "8"
      - "12"
    initial_option: "12"
    restore_value: true
    optimistic: true
    entity_category: config
    on_value:
      then:
        - script.execute: set_next_alarm

button:
  - platform: template
    name: "Clear Power Cut Fault"
    entity_category: config
    on_press:
      - lambda: |-
          id(power_cut_fault_latched) = false;
          id(power_cut_fault).publish_state(false);
      # This clears the diagnostic only; it does not restart a failed shutdown loop.
      - lambda: 'power_cut_fault_latched->update();'

  - platform: template
    id: acknowledge_freezer_alarm
    name: "Acknowledge Freezer Alarm"
    on_press:
      then:
        - if:
            condition:
              lambda: |-
                return !id(keep_on_for_testing) && id(scheduling_ready) &&
                       !id(shutdown_hold) && !id(pmos_cycle).is_running();
            then:
              - lambda: 'id(woke_from_event) = false;'
              - script.execute: pmos_cycle
            else:
              - logger.log:
                  level: WARN
                  format: "Disable Keep On for Configuration, then acknowledge the alarm again"

deep_sleep:
  id: deep_sleep_dummy #Prevents HA from showing "unavailable"

script:
  - id: publish_wake_status
    mode: restart
    then:
      - lambda: |-
          const bool alarm = id(alarm_flag).state;
          const bool event = id(event_flag).state;

          if (alarm && event) {
            id(last_wake_reason).publish_state("Alarm + Event");
          } else if (event) {
            id(last_wake_reason).publish_state("Event");
          } else if (alarm) {
            id(last_wake_reason).publish_state("Alarm");
          } else {
            id(last_wake_reason).publish_state("Unknown");
          }

          if (event && id(event_timestamp).has_state()) {
            id(last_wake_time).publish_state(id(event_timestamp).state);
            return;
          }

          auto now = id(freezer_rtc).utcnow();
          if (now.is_valid()) {
            char timestamp[32];
            snprintf(timestamp, sizeof(timestamp), "%04u-%02u-%02uT%02u:%02u:%02uZ",
                     static_cast<unsigned>(now.year), static_cast<unsigned>(now.month),
                     static_cast<unsigned>(now.day_of_month), static_cast<unsigned>(now.hour),
                     static_cast<unsigned>(now.minute), static_cast<unsigned>(now.second));
            id(last_wake_time).publish_state(timestamp);
          } else {
            id(last_wake_time).publish_state("Unknown");
          }
  - id: set_next_alarm
    mode: restart
    then:
      - lambda: |-
          id(next_alarm_valid) = false;
          if (!id(scheduling_ready) || !id(alarm_flag).has_state() ||
              !id(event_flag).has_state())
            return;
          id(freezer_rtc).read_time();

          auto now = id(freezer_rtc).utcnow();
          if (!now.is_valid()) {
            ESP_LOGE("rtc_alarm", "RTC time invalid; leaving existing alarm");
            return;
          }

          const uint32_t start_hour = static_cast<uint32_t>(id(wake_start_hour).state + 0.5f);
          const uint32_t start_minute = static_cast<uint32_t>(id(wake_start_minute).state + 0.5f);
          if (start_hour > 23 || start_minute > 59) {
            ESP_LOGE("rtc_alarm", "Invalid wake time %u:%u; leaving existing alarm",
                     static_cast<unsigned>(start_hour), static_cast<unsigned>(start_minute));
            return;
          }

          const auto interval_option = id(wake_interval_hours).current_option();
          uint32_t interval_hours = 0;
          if (interval_option == "0") {
            interval_hours = 0;
          } else if (interval_option == "1") {
            interval_hours = 1;
          } else if (interval_option == "2") {
            interval_hours = 2;
          } else if (interval_option == "4") {
            interval_hours = 4;
          } else if (interval_option == "6") {
            interval_hours = 6;
          } else if (interval_option == "8") {
            interval_hours = 8;
          } else if (interval_option == "12") {
            interval_hours = 12;
          } else {
            ESP_LOGE("rtc_alarm", "Invalid wake interval; leaving existing alarm");
            return;
          }

          const uint32_t now_minute_of_day =
              now.hour * 60UL + now.minute;

          const uint32_t start_minute_of_day =
              start_hour * 60UL + start_minute;

          uint32_t target_minute_of_day;

          if (interval_hours == 0) {
            // Once daily at the configured start time.
            target_minute_of_day = start_minute_of_day;

            if (target_minute_of_day <= now_minute_of_day) {
              target_minute_of_day += 1440UL;
            }
          } else {
            const uint32_t step_minutes = interval_hours * 60UL;

            // Minutes elapsed since the most recent occurrence of the
            // configured start time, including across midnight.
            const uint32_t elapsed_minutes =
                (now_minute_of_day + 1440UL - start_minute_of_day) % 1440UL;

            // Select the first interval strictly after the current minute.
            const uint32_t intervals_elapsed =
                elapsed_minutes / step_minutes;

            target_minute_of_day =
                start_minute_of_day +
                (intervals_elapsed + 1UL) * step_minutes;
          }

          target_minute_of_day %= 1440UL;
          id(next_alarm_hour) = target_minute_of_day / 60UL;
          id(next_alarm_minute) = target_minute_of_day % 60UL;
          id(next_alarm_valid) = id(freezer_rtc).set_alarm(
              0, id(next_alarm_minute), id(next_alarm_hour), 0xFF, 0xFF);
          if (!id(next_alarm_valid)) {
            ESP_LOGE("rtc_alarm", "RTC alarm programming failed; keeping power on");
            return;
          }

          ESP_LOGI("rtc_alarm", "Next alarm: %02u:%02u UTC (start %02u:%02u, interval %u h)",
                   static_cast<unsigned>(id(next_alarm_hour)), static_cast<unsigned>(id(next_alarm_minute)),
                   static_cast<unsigned>(start_hour), static_cast<unsigned>(start_minute),
                   static_cast<unsigned>(interval_hours));
  - id: pmos_cycle
    mode: single
    then:
      - lambda: 'id(cycle_fired) = true;'
      - script.execute: set_next_alarm
      - script.wait: set_next_alarm
      - if:
          condition:
            lambda: 'return !id(next_alarm_valid);'
          then:
            - logger.log:
                level: ERROR
                format: "Power cut blocked: alarm not programmed; retrying in 5 seconds"
            - delay: 5s
            - lambda: 'id(cycle_fired) = false;'
            - script.stop: pmos_cycle
      - component.update: freezer_temperature
      - delay: 100ms
      - if:
          condition:
            lambda: |-
              return id(keep_on_for_testing) || id(shutdown_hold) ||
                     !id(high_temp_alert).has_state() || id(high_temp_alert).state;
          then:
            - logger.log:
                level: WARN
                format: "Power cut postponed: keep-awake enabled or temperature has not cleared"
            - delay: 5s
            - lambda: 'id(cycle_fired) = false;'
            - script.stop: pmos_cycle

      # Keep the API available on the recovery boot, so a second failure can be reported.
      - if:
          condition:
            lambda: 'return !id(power_cut_retry_used);'
          then:
            - lambda: 'id(api_server).on_shutdown();'
            - wait_until:
                condition:
                  lambda: 'return id(api_server).teardown();'
                timeout: 5s
      - switch.turn_off: tmp_power
      - lambda: |-
          const bool alarm_cleared = id(freezer_rtc).clear_alarm_flag();
          const bool event_cleared = id(freezer_rtc).clear_event_flag();
          if (!alarm_cleared || !event_cleared)
            ESP_LOGE("power_cut", "RTC flag acknowledgement failed");
      - delay: 250ms
      # Execution here means the hard power cut did not happen.
      - switch.turn_on: tmp_power
      - lambda: |-
          id(power_cut_fault_latched) = true;
          id(power_cut_fault).publish_state(true);
      - lambda: 'power_cut_fault_latched->update();'
      - if:
          condition:
            lambda: 'return !id(power_cut_retry_used);'
          then:
            - logger.log:
                level: ERROR
                format: "Power cut failed; attempting one recovery reboot"
            - lambda: 'id(power_cut_retry_used) = true;'
            - lambda: 'power_cut_retry_used->update();'
            - lambda: |-
                // Flush the fault and retry marker before rebooting.
                global_preferences->sync();
                App.safe_reboot();
          else:
            - lambda: |-
                id(shutdown_hold) = true;
                id(woke_from_event) = true;
            - logger.log:
                level: ERROR
                format: "Power cut failed after recovery; staying on for diagnosis"

interval:
  - id: timing_interval
    interval: 250ms
    then:
      - lambda: |-
          if (id(report_window_complete))
            return;
          const uint32_t now = millis();
          // A state subscriber is the useful connection, not Wi-Fi or a log client.
          if (!id(subscriber_seen) && now < 15000 &&
              id(api_server).is_connected_with_state_subscription()) {
            id(subscriber_seen) = true;
            id(subscriber_since) = now;
          }
          id(report_window_complete) = id(subscriber_seen)
              ? now - id(subscriber_since) >= 7000
              : now >= 15000;
      - if:
          condition:
            lambda: |-
              return id(scheduling_ready) && id(report_window_complete) &&
                     !id(keep_on_for_testing) && !id(cycle_fired) &&
                     (!id(woke_from_event) || id(power_cut_retry_used)) &&
                     !id(shutdown_hold) &&
                     !id(pmos_cycle).is_running();
          then:
            - script.execute: pmos_cycle
